# Note: CONFIG_ZMK_SLEEP=y is inherited from the shared eyelash_corne.conf.

#EXT POWER
CONFIG_ZMK_EXT_POWER=y

#EC11 enable
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# === Split (Peripheral, the dongle is the central) ===
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

# === Basic ===
CONFIG_INPUT=y

# === Display ===
CONFIG_NICE_VIEW_WIDGET_SIDE_LABEL="L"

# === Battery (Peripheral) ===
CONFIG_ZMK_BATTERY_HISTORY=y
CONFIG_ZMK_BATTERY_HISTORY_INTERVAL_MINUTES=30
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000
