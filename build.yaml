---
include:
  # ── Settings Reset ──────────────────────────────────────────────────────────
  - board: nice_nano_v2
    shield: settings_reset

  # ── Dongle (Central, USB host, ZMK Studio, sin pantalla) ────────────────────
  - board: nice_nano_v2
    shield: eyeslash_corne_central_dongle
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n -DCONFIG_ZMK_DISPLAY=n
    artifact-name: eyelash_corne_dongle

  # ── Left side (Periférico con pantalla nice_view_gem) ───────────────────────
  - board: nice_nano_v2
    shield: eyeslash_corne_peripheral_left nice_view_gem
    artifact-name: eyelash_corne_left_peripheral

  # ── Right side (Periférico con pantalla nice_view_gem) ──────────────────────
  - board: nice_nano_v2
    shield: eyeslash_corne_peripheral_right nice_view_gem
    artifact-name: eyelash_corne_right_peripheral